<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pencarian Profil GitHub</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="container">
      <h1>
        <img class="ikon" src="https://cdn.simpleicons.org/github" alt="GitHub Icon" />Cari Profil GitHub</h1>
      <form id="formCari">
        <input
          type="text"
          id="username"
          placeholder="Masukkan username GitHub"
          required
        />
        <button type="submit">Cari</button>
      </form>
      <section id="hasil"></section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
