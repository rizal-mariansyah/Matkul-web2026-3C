<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tugas css</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Katalog produk Sepatu</h1>
    </header>

    <main>
        <h1>Daftar Produk</h1>
        <p>Berikut ini adalah daftar produk sepatu terbaik kami.</p>

        <section class="Grid">
            <div class="card">
                <img src="assets/sneakers.jpg" alt="sepatu sneakers">
                <h3>Sepatu sneakers</h3>
                <p>RP.120.000</p>
            
            </div>
            <div class="card">
                <img src="assets/pantofel.jpg" alt="sepatu pantofel">

                <h3>Sepatu pantofel</h3>
                <p>RP.300.000</p>
            
            </div>

            <div class="card">
                <img src="assets/sepatu forml.jpg" alt="sepatu formal">
                <h3>Sepatu formal</h3>
                <p>RP.200.000</p>
            
            </div>

            <div class="card">
                <img src="assets/sepatu wanita.jpg" alt="sepatu wanita">
                <h3>Sepatu casual wanita</h3>
                <p>RP.210.000</p>
            
            </div>
        </section>

        <hr>


    </main>

    <footer>
        <p>&copy;Rizal mariansyah.2026</p>
    </footer>

</html>
